input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Add a tag to confirm the data passed through our SIEM Pipeline
  mutate {
    add_tag => ["normalized_by_eagleeye"]
  }

  # 2. Normalization for Machine Learning: Ensure Event ID is always explicitly available
  # We duplicate it to a clean, top-level field so the future ML model can easily digest it
  if [winlog][event_id] {
    mutate {
      add_field => { "normalized_event_id" => "%{[winlog][event_id]}" }
    }
  }

  # 3. Clean up noise: Remove heavy, unnecessary Beats metadata to save database space 
  # and speed up processing for the Python Engine
  mutate {
    remove_field => ["[agent][ephemeral_id]", "[agent][id]", "[agent][type]", "[agent][version]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    
    # Keeping the index name starting with 'winlogbeat-' so your Python Engine and Dashboard keep working
    index => "%{[@metadata][beat]}-%{+YYYY.MM.dd}"
  }
  
  # Print to Docker logs for troubleshooting (can be commented out in final production)
  stdout { codec => rubydebug } 
}
